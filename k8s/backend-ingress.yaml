apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set to true when you configure HTTPS
spec:
  ingressClassName: nginx
  rules:
    - host: 13.206.137.151.nip.io
      http:
        paths:
          - path: /project
            pathType: Prefix
            backend:
              service:
                name: init-service
                port:
                  number: 3000
          - path: /start
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 3002
